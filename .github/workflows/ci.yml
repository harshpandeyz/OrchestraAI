name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

defaults:
  run:
    workdir: .

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

  backend-tests:
    name: Backend Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run backend runtime tests
        run: node backend/test/runtime.test.js

      - name: Run backend provider config tests
        run: node backend/test/provider-config.test.js

      - name: Run backend boundaries tests
        run: node backend/test/production-boundaries.test.js

      - name: Run backend auth integration tests
        run: node backend/test/auth-integration.test.js

      - name: Run backend SSRF tests
        run: node backend/test/ssrf.test.js

      - name: Run backend event contract tests
        run: node backend/test/event-contract.test.js

      - name: Run backend savings tests
        run: node backend/test/savings/savings-engine.test.js

      - name: Run backend analytics tests
        run: node backend/test/analytics.test.js

  frontend-tests:
    name: Frontend Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend run test -- --run

  frontend-build:
    name: Frontend Build
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

  docker-build:
    name: Docker Build
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t orchestraai .

      - name: Verify Docker image exists
        run: docker images orchestraai

  deployment-smoke:
    name: Deployment Smoke Validation
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub (if needed)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t orchestraai:$(git rev-parse --short HEAD) .
          docker tag orchestraai:$(git rev-parse --short HEAD) orchestraai:latest
          docker push orchestraai:latest

      - name: Run deployment smoke test
        run: |
          # Run the container with required env vars set to safe defaults
          docker run -d --name orchestraai-test \
            -p 8787:8787 \
            -e NODE_ENV=production \
            -e FRONTEND_ORIGIN=http://localhost:5173 \
            -e DATA_ENCRYPTION_KEY=test-key-for-smoke-test-only \
            -e RUNTIME_MODE=demo \
            -e PROVIDER=openrouter \
            orchestraai:latest

          # Wait for server to start
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health > /dev/null 2>&1; then
              echo "Server is healthy"
              break
            fi
            echo "Attempt $i/30 - server not up yet, waiting..."
            sleep 2
          done

          # Validate health endpoint
          echo "Validating /api/health..."
          HEALTH=$(curl -sf http://localhost:8787/api/health || echo '{}')
          echo "Health: $HEALTH"

          # Validate readiness endpoint
          echo "Validating /api/ready..."
          READY=$(curl -sf http://localhost:8787/api/ready || echo '{}')
          echo "Ready: $READY"

          # Validate console is served
          echo "Validating frontend console..."
          CONSOLE=$(curl -sf http://localhost:8787/ || echo '{}')
          echo "Console loaded: ${CONSOLE:0:100}"

          # Stop and remove test container
          docker stop orchestraai-test > /dev/null 2>&1 || true
          docker rm orchestraai-test > /dev/null 2>&1 || true