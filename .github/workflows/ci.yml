name: CI

# Security model:
#   push         -> build + test + (on main/release) publish immutable image
#   pull_request -> build + test ONLY (never publishes, never mutates `latest`)
#
# Publishing is gated on `github.event_name == 'push'`: a pull_request run can
# never reach the release-image or release-latest jobs. `latest` is only advanced
# on main/release AFTER every test/build/smoke job that it depends on has
# succeeded. Images are tagged by immutable git SHA; `latest` is a moving alias
# applied only after release validation.

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: .

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-root-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies
        run: npm ci

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-fe-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

  backend-tests:
    name: Backend Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run backend test suite
        run: npm run test:all

  frontend-tests:
    name: Frontend Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend run test -- --run

  frontend-build:
    name: Frontend Build (typecheck + bundle)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

  e2e:
    name: Browser E2E (Playwright)
    needs: [install, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium (with OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E suite
        run: npm run test:e2e

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.artifacts
          retention-days: 7

  release-gate:
    name: Assert Release Conditions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Static-regression release gate
        run: node qa/ci-release-gate.test.js

      - name: Clean-source hygiene
        run: node qa/clean-install-check.js

      - name: Secret scan
        run: node qa/secret-scan.js

  docker-build:
    name: Docker Build (no publish)
    needs: [frontend-build, release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t orchestraai:ci .

      - name: Verify Docker image exists
        run: docker images orchestraai:ci

  container-smoke:
    name: Single-Container Smoke (demo topology)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run demo-mode container smoke test
        run: bash deploy/scripts/smoke-container.sh

  compose-smoke:
    name: Full Topology Smoke (Postgres + Redis + sandbox)
    if: github.event_name == 'push'
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run production-topology smoke test
        run: bash deploy/scripts/smoke-topology.sh

  release-image:
    name: Publish Immutable Image (:sha)
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-tests, frontend-build, e2e, docker-build, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub (push-only, never on PRs)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push immutable image
        run: |
          docker build -t "${IMAGE_REPO:-orchestraai}:${GITHUB_SHA}" .
          docker push "${IMAGE_REPO:-orchestraai}:${GITHUB_SHA}"
        env:
          IMAGE_REPO: ${{ vars.IMAGE_REPO || 'orchestraai' }}

  release-latest:
    name: Advance `latest` (release branch only)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    needs: release-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Tag and push `latest`
        run: |
          docker pull "${IMAGE_REPO:-orchestraai}:${GITHUB_SHA}"
          docker tag "${IMAGE_REPO:-orchestraai}:${GITHUB_SHA}" "${IMAGE_REPO:-orchestraai}:latest"
          docker push "${IMAGE_REPO:-orchestraai}:latest"
        env:
          IMAGE_REPO: ${{ vars.IMAGE_REPO || 'orchestraai' }}